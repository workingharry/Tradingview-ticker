name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend Tests (macOS)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Build Sidecar Launcher for Tauri Tests
        run: |
          python scripts/build_sidecar.py --tauri-bin-dir src-tauri/bin

      - name: Cache Cargo and Tauri Target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Pre-compile Rust Test Binary
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --no-run

      - name: Run Backend Pytest Suite
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          pytest -q --ignore=tests/test_e2e_live.py --ignore=tests/stress_websocket.py -m "not network" -rs --timeout=120 --timeout-method=thread -o faulthandler_timeout=100 --durations=20

  frontend:
    name: Frontend Typecheck & Vitest (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript Typecheck
        run: npm run typecheck

      - name: Run Vitest Unit Tests
        run: npm run test:fe
